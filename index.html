<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deterministic Rollback Netcode vs Lockstep</title>
    <style>
      body {
        margin: 0;
        background: #0f111a;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }
      .boards {
        display: flex;
        gap: 24px;
        margin-top: 16px;
      }
      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas {
        background: #1a1c29;
        border: 2px solid #2e344d;
        border-radius: 4px;
      }
      h2 {
        font-size: 14px;
        color: #8f93a2;
        margin: 8px 0;
      }
      #hud {
        margin-top: 16px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        background: #1a1c29;
        padding: 12px 16px;
        border-radius: 4px;
        min-width: 500px;
        border: 1px solid #2e344d;
      }
      .controls {
        margin-top: 12px;
        display: flex;
        gap: 16px;
        font-size: 13px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Two boards, one game</h1>
    <p>
      Two clients on the same page with a simulated 150 ms latency channel between them.
      Position and collision resolution are 100% deterministic (16.16 fixed-point).
    </p>
    <div class="boards">
      <div class="panel">
        <h2>P1 — arrow keys</h2>
        <canvas id="c1" width="320" height="240"></canvas>
      </div>
      <div class="panel">
        <h2>P2 — WASD keys</h2>
        <canvas id="c2" width="320" height="240"></canvas>
      </div>
    </div>
    <div class="controls">
      <label>
        <input type="checkbox" id="predict" checked />
        rollback (prediction) enabled — disable for pure lockstep
      </label>
    </div>
    <pre id="hud">loading…</pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
